spring:
  application:
    name: spring-ai2-example-mcp-client
  ai:
    openai:
      api-key: ${AI_DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        model: qwen-plus
    mcp:
      client:
        enabled: true
        type: sync
        streamable-http:
          connections:
            my-mcp-server:
              url: http://localhost:8080

server:
  port: 8081