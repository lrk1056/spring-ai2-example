spring:
  application:
    name: spring-ai2-example
  ai:
    openai:
      api-key: ${AI_DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        model: qwen-plus
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3-vl:4b
logging:
  level:
    org.springframework.ai: debug  # 查看内置 SimpleLoggerAdvisor 的debug日志