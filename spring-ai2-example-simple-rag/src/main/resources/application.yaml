spring:
  application:
    name: spring-ai2-example
  ai:
    openai:
      api-key: ${AI_DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        model: qwen-plus
      embedding:
        model: text-embedding-v4
        dimensions: 2048  # 向量维度

    vectorstore:  # 向量存储
      redis:
        initialize-schema: true  # 是否启动时初始化向量索引结构
        index-name: tf_ai_vectorstore_index  # 向量索引名称
        prefix: tf_ai_  # 向量索引前缀
  data:
    redis:
      url: redis://localhost:6379
      client-type: jedis
